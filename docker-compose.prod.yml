version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lafarge_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lafarge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-lafarge_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - internal_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lafarge_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lafarge_redis_prod
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - internal_backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lafarge_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    expose:
      - "8000"
    volumes:
      - ./models:/app/models
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - internal_backend
      - public_web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lafarge_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - public_web

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  internal_backend:
    internal: true
  public_web:
